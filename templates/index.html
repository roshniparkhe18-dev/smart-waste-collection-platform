<!DOCTYPE html>
<html>

<head>
    <title>EcoCollect - Smart Waste Collection</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold">
            ♻️ EcoCollect
        </a>

        <a href="/admin" class="btn btn-light">
            Admin Dashboard
        </a>
    </div>
</nav>


<div class="container mt-5">

    <div class="text-center mb-4">

        <h1>
            Smart Waste Collection
            & Recycling Platform
        </h1>

        <p class="lead">
            Request waste pickup easily and track your collection.
        </p>

    </div>


    <div class="card shadow p-4">

        <h3 class="mb-4">
            ♻️ Request Waste Pickup
        </h3>


        <form method="POST" action="/request-pickup">


            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Waste Category
                </label>

                <select
                    name="category"
                    class="form-select"
                    required>

                    <option value="">
                        Select Waste Category
                    </option>

                    {% for category in categories %}

                    <option value="{{ category }}">
                        {{ category }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Pickup Location
                </label>

                <textarea
                    name="address"
                    class="form-control"
                    rows="3"
                    required>
                </textarea>

            </div>


            <div class="row">

                <div class="col-md-6">

                    <label class="form-label">
                        Pickup Date
                    </label>

                    <input
                        type="date"
                        name="pickup_date"
                        class="form-control"
                        required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Pickup Time
                    </label>

                    <input
                        type="time"
                        name="pickup_time"
                        class="form-control"
                        required>

                </div>

            </div>


            <div class="mb-3 mt-3">

                <label class="form-label">
                    Additional Notes
                </label>

                <textarea
                    name="notes"
                    class="form-control"
                    rows="3"
                    placeholder="Example: Plastic bottles, approximately 5 kg">
                </textarea>

            </div>


            <button
                type="submit"
                class="btn btn-success w-100">

                🚛 Submit Pickup Request

            </button>


        </form>

    </div>

</div>


</body>

</html>
